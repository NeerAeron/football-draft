<!doctype html>
<!--
  Source of app/assets/og-image.png (1200 × 630, Open Graph / Twitter card).
  Render: node tools/og/render.mjs   (Playwright + the pre-installed Chromium)
  Uses only the app's own fonts and flag SVGs. No player data or ratings on the card.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Barlow Condensed';
        font-weight: 800;
        src: url('../../app/assets/fonts/barlow-condensed-latin-800-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-weight: 700;
        src: url('../../app/assets/fonts/barlow-condensed-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 500;
        src: url('../../app/assets/fonts/inter-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        src: url('../../app/assets/fonts/inter-latin-600-normal.woff2') format('woff2');
      }
      :root {
        --ink: #070b16;
        --volt: #cdf545;
        --gold: #f5c84c;
        --text-1: #f3f6fd;
        --text-2: #b4bfd6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--ink);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: var(--text-1);
        font-family: Inter, sans-serif;
        background:
          radial-gradient(60% 70% at 78% 30%, rgb(245 200 76 / 0.16), transparent 60%),
          radial-gradient(50% 60% at 0% 0%, rgb(140 170 255 / 0.18), transparent 70%),
          linear-gradient(180deg, #0c1427 0%, #070b16 100%);
      }
      /* floodlight beams */
      .beam {
        position: absolute;
        top: -40px;
        width: 520px;
        height: 760px;
        background: linear-gradient(180deg, rgb(234 242 255 / 0.18), transparent 75%);
        filter: blur(2px);
      }
      .beam.l {
        left: 360px;
        transform: skewX(24deg);
        clip-path: polygon(40% 0, 52% 0, 100% 100%, 0 100%);
      }
      .beam.r {
        right: -120px;
        transform: skewX(-22deg);
        clip-path: polygon(48% 0, 60% 0, 100% 100%, 0 100%);
      }
      .left {
        position: absolute;
        left: 72px;
        top: 56px;
        width: 620px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .brand b {
        color: var(--volt);
        margin-left: 8px;
      }
      h1 {
        margin-top: 44px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 800;
        font-size: 118px;
        line-height: 0.88;
        letter-spacing: -0.005em;
        text-transform: uppercase;
      }
      h1 em {
        display: block;
        font-style: normal;
        color: var(--volt);
        text-shadow: 0 0 36px rgb(205 245 69 / 0.35);
      }
      .lead {
        margin-top: 24px;
        max-width: 560px;
        color: var(--text-2);
        font-size: 24px;
        font-weight: 500;
        line-height: 1.38;
      }
      .chips {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }
      .chip {
        padding: 9px 18px;
        border-radius: 999px;
        border: 1.5px solid rgb(255 255 255 / 0.16);
        background: rgb(255 255 255 / 0.05);
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .chip.gold {
        border-color: rgb(245 200 76 / 0.6);
        color: var(--gold);
      }
      .chip.volt {
        border-color: rgb(205 245 69 / 0.6);
        color: var(--volt);
      }
      /* pitch */
      .pitch {
        position: absolute;
        right: 70px;
        top: 52px;
        width: 400px;
        height: 526px;
        border-radius: 26px;
        overflow: hidden;
        transform: perspective(1400px) rotateY(-9deg) rotateX(3deg);
        background:
          radial-gradient(120% 90% at 50% 50%, transparent 55%, rgb(0 10 5 / 0.5)),
          repeating-linear-gradient(180deg, #186b3e 0 8.333%, #155f37 8.333% 16.666%);
        box-shadow:
          0 0 0 1.5px rgb(255 255 255 / 0.12),
          0 40px 80px rgb(0 0 0 / 0.55),
          0 0 120px rgb(205 245 69 / 0.12);
      }
      .pitch svg.lines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: rgb(236 255 240 / 0.4);
        stroke-width: 2;
      }
      .tok {
        position: absolute;
        width: 64px;
        height: 64px;
        margin: -32px 0 0 -32px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, #fff1c4, #f5c84c 45%, #a8770f 70%, #f7d774);
        box-shadow: 0 10px 18px rgb(0 0 0 / 0.45);
      }
      .tok.holo {
        background: conic-gradient(from 30deg, #ff8fd0, #b494ff, #6fd6ff, #7dffc0, #ff8fd0);
      }
      .tok img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
      }
      .link {
        position: absolute;
        height: 3px;
        transform-origin: 0 50%;
        background: linear-gradient(90deg, #f5c84c, #f7d774);
        border-radius: 2px;
        box-shadow: 0 0 10px rgb(245 200 76 / 0.6);
        opacity: 0.85;
      }
      .tag {
        margin-top: 26px;
        color: var(--text-2);
        font-size: 21px;
        font-weight: 500;
      }
      .tag b {
        color: var(--text-1);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="beam l"></div>
      <div class="beam r"></div>
      <div class="left">
        <div class="brand">
          <svg width="52" height="52" viewBox="0 0 40 40" aria-hidden="true">
            <rect x="1" y="1" width="38" height="38" rx="11" fill="#cdf545" />
            <circle cx="20" cy="20" r="11.5" fill="#070b16" />
            <path d="M20 14.2l5.5 4-2.1 6.5h-6.8l-2.1-6.5z" fill="#cdf545" />
            <path
              d="M20 14.2V8.5M25.5 18.2l5.4-1.8M23.4 24.7l3.4 4.6M16.6 24.7l-3.4 4.6M14.5 18.2l-5.4-1.8"
              fill="none"
              stroke="#cdf545"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <span>World Cup<b>Draft</b></span>
        </div>
        <h1>Draft an XI.<em>Win it all.</em></h1>
        <p class="lead">
          Spin nations, pick real FC&nbsp;26 players from their call-ups, then take your XI through
          a World Cup.
        </p>
        <div class="chips">
          <span class="chip volt">World Cup Run</span>
          <span class="chip gold">Daily Challenge</span>
          <span class="chip">Versus</span>
        </div>
        <p class="tag">Same spins as your friend — <b>can you beat their run?</b></p>
      </div>
      <div class="pitch" id="pitch">
        <svg class="lines" viewBox="0 0 400 526" preserveAspectRatio="none">
          <rect x="14" y="14" width="372" height="498" rx="6" />
          <path d="M14 263h372" />
          <circle cx="200" cy="263" r="48" />
          <path d="M100 14v76h200V14M152 14v26h96V14" />
          <path d="M100 512v-76h200v76M152 512v-26h96v26" />
        </svg>
      </div>
    </div>
    <script>
      // 4-3-3 tokens with flags from the app (decorative: no names, no ratings).
      const flags = ['br', 'ar', 'fr', 'es', 'gb-eng', 'nl', 'pt', 'de', 'ma', 'jp', 'it'];
      const slots = [
        [50, 89], // GK
        [16, 70],
        [38, 74],
        [62, 74],
        [84, 70], // back four
        [28, 47],
        [50, 53],
        [72, 47], // midfield
        [18, 22],
        [50, 15],
        [82, 22], // attack
      ];
      const holo = new Set([1, 6, 9, 10]);
      const pitch = document.getElementById('pitch');
      const W = 400,
        H = 526;
      const pos = ([x, y]) => [(x / 100) * W, (y / 100) * H];
      // a few gold Links lines (same nation / club neighbours)
      for (const [a, b] of [
        [9, 10],
        [6, 9],
        [5, 6],
        [2, 3],
        [3, 7],
      ]) {
        const [x1, y1] = pos(slots[a]),
          [x2, y2] = pos(slots[b]);
        const l = document.createElement('div');
        l.className = 'link';
        l.style.left = x1 + 'px';
        l.style.top = y1 + 'px';
        l.style.width = Math.hypot(x2 - x1, y2 - y1) + 'px';
        l.style.transform = `rotate(${Math.atan2(y2 - y1, x2 - x1)}rad)`;
        pitch.append(l);
      }
      slots.forEach((s, i) => {
        const [x, y] = pos(s);
        const t = document.createElement('div');
        t.className = 'tok' + (holo.has(i) ? ' holo' : '');
        t.style.left = x + 'px';
        t.style.top = y + 'px';
        const img = new Image();
        img.src = `../../app/assets/flags/${flags[i]}.svg`;
        t.append(img);
        pitch.append(t);
      });
    </script>
  </body>
</html>
